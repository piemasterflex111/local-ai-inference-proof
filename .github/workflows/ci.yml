name: CI - Inference Validation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Cloud CI Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'

      - name: "Prepare CI mocks"
        run: scripts/setup_ci_mocks.sh

      - name: Run pytest (skip live endpoint tests on cloud runners)
        env:
          CI_SKIP_ENDPOINT_TESTS: "1"
        run: |
          python -m pytest tests/ -v

      - name: Generate CI smoke benchmark artifact
        run: |
          mkdir -p artifacts
          python scripts/ci_smoke_benchmark.py --output-dir artifacts

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-artifact
          path: artifacts/ci_smoke_result.json
          retention-days: 30
