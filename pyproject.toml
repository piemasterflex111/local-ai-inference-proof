[project]
name = "local-ai-inference-proof"
version = "0.1.0"
description = "Local AI stack proof repo with FastAPI, issue classification, Docker, and OpenShift manifests"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx"
]

[project.scripts]
local-ai-stack-classify = "local_ai_stack_proof.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
